services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: influence
      POSTGRES_USER: influence
      POSTGRES_PASSWORD: influence
    ports: ["5432:5432"]
    volumes: ["influence-postgres:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://influence:influence@db:5432/influence
    ports: ["8000:8000"]
    depends_on: [db]
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  influence-postgres:
